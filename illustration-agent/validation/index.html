<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>小说生图 Agent 验证台</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <p class="eyebrow">NOVEL ILLUSTRATION AGENT</p>
        <h1>小说章节生图验证台</h1>
        <p>独立读取小说正文，不依赖 memory-agent。当前页面使用 Seedream 4.5 模拟器，不产生真实调用费用。</p>
      </div>
      <button id="reset" class="ghost">重置数据</button>
    </header>

    <section class="steps">
      <article>
        <span>01</span>
        <h2>锁定画风</h2>
        <p>确认全书视觉基准；后续章节不随机漂移。</p>
        <button id="setup">创建并锁定视觉圣经</button>
      </article>
      <article>
        <span>02</span>
        <h2>解析正文</h2>
        <p>识别人物与关键场景，返回标准参考图审批任务。</p>
        <button id="analyze">解析第一章</button>
      </article>
      <article>
        <span>03</span>
        <h2>确认人物</h2>
        <p>主要人物首张标准参考图必须由用户选择。</p>
        <button id="references" disabled>生成 4 张候选图</button>
      </article>
    </section>

    <section class="workspace">
      <div class="novel-panel">
        <div class="section-title"><span>小说正文</span><small>结构化段落</small></div>
        <div id="novel"></div>
      </div>
      <aside>
        <div class="section-title"><span>运行状态</span><small id="status">尚未开始</small></div>
        <pre id="result">等待操作…</pre>
      </aside>
    </section>

    <section>
      <div class="section-title"><span>人物标准参考图</span><small>点击一张确认</small></div>
      <div id="candidate-grid" class="candidate-grid empty">尚无候选图</div>
    </section>

    <section>
      <div class="section-title">
        <span>当前章节插图</span>
        <div class="regenerate-controls">
          <input id="regeneration-reason" value="人物表情更紧张，强化暮色和火光对比" aria-label="重新生成原因">
          <button id="regenerate" class="ghost" disabled>重新生成</button>
        </div>
      </div>
      <div id="illustration" class="illustration empty">自动审核通过后，将插入正文关键段落之后</div>
    </section>

    <section>
      <div class="section-title"><span>历史版本</span><small>旧图不覆盖</small></div>
      <div id="history" class="history empty">暂无历史版本</div>
    </section>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
